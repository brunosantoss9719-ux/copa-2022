name: Build Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot
        run: |
          curl -L -o godot.zip "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          unzip -q godot.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
          sudo mv Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          godot --version
      - name: Install export templates
        run: |
          curl -L -o templates.tpz "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz"
          rm -rf /tmp/godot-templates
          mkdir -p /tmp/godot-templates
          unzip -q templates.tpz -d /tmp/godot-templates
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          cp -R /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/4.7.2.stable/"
      - name: Import and smoke
        run: |
          godot --headless --path . --import
          godot --headless --path . --script tests/smoke.gd
      - name: Export Windows x86_64
        id: export
        run: |
          mkdir -p dist
          SHORT_SHA="$(git rev-parse --short HEAD)"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          godot --headless --path . --export-release "Windows x86_64" "dist/Linha-de-Sombra-Copa-2022-$SHORT_SHA.exe"
          test -s "dist/Linha-de-Sombra-Copa-2022-$SHORT_SHA.exe"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linha-de-sombra-0.1.0-${{ steps.export.outputs.short_sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
